name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "implementation/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Syntax-check isolated PostgreSQL rehearsal harness
        run: node --check scripts/pg-concurrency-rehearsal.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Run real PostgreSQL 17 concurrency rehearsal
        env:
          PSQL_PATH: /usr/bin/psql
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ethereal_phase3_test
          PHASE3_ALLOW_CONTAINER_HOST: 'true'
        run: node scripts/pg-concurrency-rehearsal.mjs
      - name: Upload PostgreSQL rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethereal-postgresql-17-rehearsal
          path: |
            reports/ETHEREAL_PHASE_3_CONCURRENCY_EVIDENCE.json
            reports/ETHEREAL_PHASE_3_CONCURRENCY_EVIDENCE.log
          if-no-files-found: ignore
      - name: Print exact release migration SHA-256 manifest
        run: node scripts/release-migration-manifest.mjs
      - name: Verify frozen migration allowlist and hashes
        run: node scripts/verify-release-preflight.mjs
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
